<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      color: #1a1a1a;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-main {
      display: flex;
      gap: 8px;
    }

    .input-sub {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-sub label {
      font-size: 0.85rem;
      color: #888;
      white-space: nowrap;
    }

    input[type="text"],
    input[type="date"] {
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      color: #1a1a1a;
      font-family: inherit;
    }

    input[type="text"] { flex: 1; }

    input[type="text"]:focus,
    input[type="date"]:focus { border-color: #4f46e5; }

    input[type="text"]::placeholder { color: #aaa; }

    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.5;
      cursor: pointer;
    }

    button.add-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button.add-btn:hover  { background: #4338ca; }
    button.add-btn:active { background: #3730a3; }

    /* ── List items ── */
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    li {
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background 0.1s;
    }

    li:hover { background: #f9f9f9; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    li input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #d0d0d0;
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    li input[type="checkbox"]:checked {
      background: #4f46e5;
      border-color: #4f46e5;
    }

    li input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .item-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .item-text {
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    li.done .item-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .item-due {
      font-size: 0.78rem;
      font-weight: 500;
      color: #888;
    }

    .item-due.overdue { color: #ef4444; }
    .item-due.today   { color: #f59e0b; }
    .item-due.soon    { color: #4f46e5; }

    li.done .item-due { color: #bbb !important; }

    .item-summary {
      font-size: 0.78rem;
      color: #bbb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    li.done .item-summary { color: #ddd; }

    /* ── Buttons ── */
    button.delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    button.delete-btn:hover { color: #ef4444; }

    button.details-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      color: #bbb;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    button.details-btn:hover    { color: #4f46e5; }
    button.details-btn.has-data { color: #4f46e5; }
    li.done button.details-btn  { color: #ddd; }

    .details-chevron {
      display: inline-block;
      transition: transform 0.2s;
    }

    button.details-btn.open .details-chevron { transform: rotate(90deg); }

    /* ── Details panel ── */
    .details-panel {
      margin-top: 8px;
      margin-left: 30px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .details-panel.open { display: flex; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #bbb;
      margin-bottom: 6px;
    }

    /* Notes */
    .details-panel textarea {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-family: inherit;
      color: #1a1a1a;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      min-height: 68px;
      transition: border-color 0.15s;
    }

    .details-panel textarea:focus { border-color: #4f46e5; }

    .details-panel textarea:disabled {
      background: #fafafa;
      color: #999;
      cursor: default;
      border-color: #ececec;
    }

    .saved-msg {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 4px;
      height: 14px;
    }

    /* Steps */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
    }

    .step-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .step-text {
      flex: 1;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .step-item.done .step-text {
      text-decoration: line-through;
      color: #aaa;
    }

    button.step-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #ddd;
      font-size: 0.85rem;
      padding: 1px 3px;
      border-radius: 3px;
      transition: color 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }

    button.step-del:hover { color: #ef4444; }

    li.done .step-item input[type="checkbox"] { pointer-events: none; }
    li.done button.step-del { display: none; }

    .step-add {
      display: flex;
      gap: 6px;
    }

    .step-add input {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      color: #1a1a1a;
    }

    .step-add input:focus { border-color: #4f46e5; }
    .step-add input::placeholder { color: #bbb; }

    button.step-add-btn {
      background: #f0efff;
      color: #4f46e5;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button.step-add-btn:hover { background: #e0deff; }

    li.done .step-add { display: none; }

    /* Photo */
    .photo-area { display: flex; flex-direction: column; gap: 8px; }

    .photo-preview {
      position: relative;
      display: inline-block;
    }

    .photo-preview img {
      width: 100%;
      border-radius: 8px;
      display: block;
      max-height: 260px;
      object-fit: cover;
    }

    button.photo-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.photo-remove:hover { background: rgba(200,0,0,0.75); }

    li.done button.photo-remove { display: none; }

    label.photo-upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f5f5f5;
      border: 1.5px dashed #ddd;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #888;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    label.photo-upload-btn:hover { border-color: #4f46e5; color: #4f46e5; }

    li.done label.photo-upload-btn { display: none; }

    input[type="file"] { display: none; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Checklist</h1>
    <div class="input-row">
      <div class="input-main">
        <input type="text" id="new-item" placeholder="Add an item…" maxlength="200">
        <button class="add-btn" onclick="addItem()">Add</button>
      </div>
      <div class="input-sub">
        <label for="new-due">Due date</label>
        <input type="date" id="new-due">
      </div>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty-msg">No items yet. Add one above.</p>
  </div>

  <script>
    const STORAGE_KEY = 'checklist-items';

    function loadItems() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    let items = loadItems();
    const openDetails = new Set();
    const saveTimers = {};

    function hasData(item) {
      return !!(item.notes || (item.steps && item.steps.length) || item.photo);
    }

    function formatDue(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const due = new Date(y, m - 1, d);
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((due - today) / 86400000);
      const label = due.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      let cls = '';
      if      (diff < 0)   cls = 'overdue';
      else if (diff === 0) cls = 'today';
      else if (diff <= 3)  cls = 'soon';
      const prefix = diff < 0   ? 'Overdue · ' :
                     diff === 0 ? 'Due today · ' :
                     diff === 1 ? 'Due tomorrow · ' : 'Due ';
      return { text: prefix + label, cls };
    }

    function buildSummary(item) {
      const parts = [];
      if (item.notes) parts.push(item.notes.split('\n')[0]);
      if (item.steps && item.steps.length) {
        const done = item.steps.filter(s => s.done).length;
        parts.push(`${done}/${item.steps.length} steps`);
      }
      if (item.photo) parts.push('📷 photo');
      return parts.join(' · ');
    }

    function render() {
      const list = document.getElementById('list');
      const emptyMsg = document.getElementById('empty-msg');
      list.innerHTML = '';
      emptyMsg.style.display = items.length === 0 ? 'block' : 'none';

      items.forEach((item, i) => {
        const li = document.createElement('li');
        if (item.done) li.classList.add('done');

        /* ── top row ── */
        const row = document.createElement('div');
        row.className = 'item-row';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.done;
        cb.addEventListener('change', () => toggleDone(i));

        const body = document.createElement('div');
        body.className = 'item-body';

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = item.text;
        body.appendChild(span);

        if (item.due) {
          const { text, cls } = formatDue(item.due);
          const dueEl = document.createElement('span');
          dueEl.className = 'item-due' + (cls ? ' ' + cls : '');
          dueEl.textContent = text;
          body.appendChild(dueEl);
        }

        const isOpen = openDetails.has(i);

        if (!isOpen && hasData(item)) {
          const summary = document.createElement('div');
          summary.className = 'item-summary';
          summary.textContent = buildSummary(item);
          summary.addEventListener('click', () => toggleDetails(i));
          body.appendChild(summary);
        }

        const detailsBtn = document.createElement('button');
        detailsBtn.className = 'details-btn' + (hasData(item) ? ' has-data' : '') + (isOpen ? ' open' : '');
        detailsBtn.title = isOpen ? 'Collapse details' : 'Expand details';
        const chev = document.createElement('i');
        chev.className = 'details-chevron';
        chev.textContent = '▸';
        detailsBtn.append(chev, document.createTextNode(' Details'));
        detailsBtn.addEventListener('click', () => toggleDetails(i));

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.title = 'Delete';
        del.addEventListener('click', () => deleteItem(i));

        row.append(cb, body, detailsBtn, del);

        /* ── details panel ── */
        const panel = document.createElement('div');
        panel.className = 'details-panel' + (isOpen ? ' open' : '');

        /* Notes section */
        const notesSection = document.createElement('div');
        const notesLabel = document.createElement('div');
        notesLabel.className = 'section-label';
        notesLabel.textContent = 'Notes';
        const ta = document.createElement('textarea');
        ta.placeholder = 'Add notes…';
        ta.value = item.notes || '';
        ta.disabled = item.done;
        const savedMsg = document.createElement('div');
        savedMsg.className = 'saved-msg';
        ta.addEventListener('input', () => scheduleNoteSave(i, ta, savedMsg));
        notesSection.append(notesLabel, ta, savedMsg);

        /* Steps section */
        const stepsSection = document.createElement('div');
        const stepsLabel = document.createElement('div');
        stepsLabel.className = 'section-label';
        stepsLabel.textContent = 'Steps';
        const stepsList = document.createElement('div');
        stepsList.className = 'steps-list';

        (item.steps || []).forEach((step, si) => {
          const stepRow = document.createElement('div');
          stepRow.className = 'step-item' + (step.done ? ' done' : '');

          const scb = document.createElement('input');
          scb.type = 'checkbox';
          scb.checked = step.done;
          scb.addEventListener('change', () => toggleStep(i, si));

          const stxt = document.createElement('span');
          stxt.className = 'step-text';
          stxt.textContent = step.text;

          const sdel = document.createElement('button');
          sdel.className = 'step-del';
          sdel.textContent = '✕';
          sdel.title = 'Remove step';
          sdel.addEventListener('click', () => deleteStep(i, si));

          stepRow.append(scb, stxt, sdel);
          stepsList.appendChild(stepRow);
        });

        const stepAddRow = document.createElement('div');
        stepAddRow.className = 'step-add';
        const stepInput = document.createElement('input');
        stepInput.type = 'text';
        stepInput.placeholder = 'Add a step…';
        stepInput.maxLength = 200;
        const stepAddBtn = document.createElement('button');
        stepAddBtn.className = 'step-add-btn';
        stepAddBtn.textContent = '+ Add';
        const doAddStep = () => {
          const text = stepInput.value.trim();
          if (!text) return;
          if (!items[i].steps) items[i].steps = [];
          items[i].steps.push({ text, done: false });
          saveItems(items);
          render();
        };
        stepAddBtn.addEventListener('click', doAddStep);
        stepInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAddStep(); });
        stepAddRow.append(stepInput, stepAddBtn);

        stepsSection.append(stepsLabel, stepsList, stepAddRow);

        /* Photo section */
        const photoSection = document.createElement('div');
        const photoLabel = document.createElement('div');
        photoLabel.className = 'section-label';
        photoLabel.textContent = 'Photo';
        const photoArea = document.createElement('div');
        photoArea.className = 'photo-area';

        if (item.photo) {
          const preview = document.createElement('div');
          preview.className = 'photo-preview';
          const img = document.createElement('img');
          img.src = item.photo;
          img.alt = 'Attached photo';
          const removeBtn = document.createElement('button');
          removeBtn.className = 'photo-remove';
          removeBtn.textContent = 'Remove';
          removeBtn.addEventListener('click', () => removePhoto(i));
          preview.append(img, removeBtn);
          photoArea.appendChild(preview);
        }

        if (!item.done) {
          const fileId = `photo-input-${i}`;
          const uploadLabel = document.createElement('label');
          uploadLabel.className = 'photo-upload-btn';
          uploadLabel.htmlFor = fileId;
          uploadLabel.textContent = item.photo ? '📷 Replace photo' : '📷 Add photo';
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.id = fileId;
          fileInput.accept = 'image/*';
          fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            if (file.size > 4 * 1024 * 1024) {
              alert('Image must be under 4 MB.');
              return;
            }
            const reader = new FileReader();
            reader.onload = e => {
              items[i].photo = e.target.result;
              saveItems(items);
              render();
            };
            reader.readAsDataURL(file);
          });
          photoArea.append(uploadLabel, fileInput);
        }

        photoSection.append(photoLabel, photoArea);

        panel.append(notesSection, stepsSection, photoSection);
        li.append(row, panel);
        list.appendChild(li);
      });
    }

    function toggleDetails(i) {
      if (openDetails.has(i)) openDetails.delete(i);
      else openDetails.add(i);
      render();
      if (openDetails.has(i)) {
        const panels = document.querySelectorAll('.details-panel.open');
        if (panels.length) panels[panels.length - 1].querySelector('textarea').focus();
      }
    }

    function scheduleNoteSave(i, ta, savedMsg) {
      clearTimeout(saveTimers[i]);
      savedMsg.textContent = '';
      saveTimers[i] = setTimeout(() => {
        items[i].notes = ta.value;
        saveItems(items);
        savedMsg.textContent = 'Saved';
        setTimeout(() => { savedMsg.textContent = ''; }, 1500);
      }, 600);
    }

    function toggleStep(i, si) {
      items[i].steps[si].done = !items[i].steps[si].done;
      saveItems(items);
      render();
    }

    function deleteStep(i, si) {
      items[i].steps.splice(si, 1);
      saveItems(items);
      render();
    }

    function removePhoto(i) {
      items[i].photo = null;
      saveItems(items);
      render();
    }

    function addItem() {
      const input = document.getElementById('new-item');
      const dateInput = document.getElementById('new-due');
      const text = input.value.trim();
      if (!text) return;
      items.push({ text, done: false, due: dateInput.value || null, notes: '', steps: [], photo: null });
      saveItems(items);
      render();
      input.value = '';
      dateInput.value = '';
      input.focus();
    }

    function toggleDone(i) {
      items[i].done = !items[i].done;
      saveItems(items);
      render();
    }

    function deleteItem(i) {
      items.splice(i, 1);
      openDetails.delete(i);
      saveItems(items);
      render();
    }

    document.getElementById('new-item').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    render();
  </script>
</body>
</html>
